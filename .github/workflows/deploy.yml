name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:  # Allow manual triggering

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://${{ secrets.AWS_REGION }}.console.aws.amazon.com/cloudwatch/home?region=${{ secrets.AWS_REGION }}#metricsV2:namespace=PowerScale/Cluster
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.5.7'
          terraform_wrapper: false

      - name: Build Lambda deployment package
        run: |
          cd powerscale-monitor/aws
          chmod +x build.sh
          ./build.sh

      - name: Terraform Init
        run: |
          cd powerscale-monitor/aws/terraform
          terraform init \
            -backend-config="bucket=${{ secrets.TERRAFORM_STATE_BUCKET }}" \
            -backend-config="key=powerscale-monitor/terraform.tfstate" \
            -backend-config="region=${{ secrets.AWS_REGION || 'us-east-1' }}"

      - name: Terraform Plan
        id: plan
        run: |
          cd powerscale-monitor/aws/terraform
          terraform plan -out=tfplan \
            -var="powerscale_host=${{ secrets.POWERSCALE_HOST }}" \
            -var="powerscale_username=${{ secrets.POWERSCALE_USERNAME }}" \
            -var="powerscale_password=${{ secrets.POWERSCALE_PASSWORD }}" \
            -var="alert_emails=${{ secrets.ALERT_EMAILS }}" \
            -var="aws_region=${{ secrets.AWS_REGION || 'us-east-1' }}"

      - name: Terraform Apply
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          cd powerscale-monitor/aws/terraform
          terraform apply -auto-approve tfplan

      - name: Get Lambda Function Name
        id: lambda
        run: |
          cd powerscale-monitor/aws/terraform
          FUNCTION_NAME=$(terraform output -raw lambda_function_arn | awk -F: '{print $NF}')
          echo "function_name=$FUNCTION_NAME" >> $GITHUB_OUTPUT

      - name: Test Lambda Invocation
        run: |
          aws lambda invoke \
            --function-name ${{ steps.lambda.outputs.function_name }} \
            --payload '{}' \
            --cli-binary-format raw-in-base64-out \
            response.json
          cat response.json

      - name: Upload Terraform Plan
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan
          path: powerscale-monitor/aws/terraform/tfplan

      - name: Deployment Summary
        if: always()
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Region**: ${{ secrets.AWS_REGION || 'us-east-1' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Lambda Function**: ${{ steps.lambda.outputs.function_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Next Steps" >> $GITHUB_STEP_SUMMARY
          echo "1. Check CloudWatch metrics: https://${{ secrets.AWS_REGION || 'us-east-1' }}.console.aws.amazon.com/cloudwatch/home?region=${{ secrets.AWS_REGION || 'us-east-1' }}#metricsV2:namespace=PowerScale/Cluster" >> $GITHUB_STEP_SUMMARY
          echo "2. Verify Lambda logs: \`aws logs tail /aws/lambda/${{ steps.lambda.outputs.function_name }} --follow\`" >> $GITHUB_STEP_SUMMARY
